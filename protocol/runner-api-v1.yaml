openapi: 3.1.0

info:
  title: Vortex Arena runner management API
  version: "1.0.0"
  description: |
    What a control plane may ask a runner to do, and what a runner reports back.

    This is the contract, not a description of an implementation. Two planes code against it:
    `Launcher.WebServer`, which the host owner runs, and Conductor, which operates adopted servers.
    They are peers over one protocol rather than two management implementations, which is why adding
    a verb here gives both of them the feature with no further protocol work.

    The same operations travel two ways. Over HTTP a plane serves them to a browser; over the runner
    link they are tunneled inside a `CommandEnvelope` carrying this method, this path and this body.
    A runner implements them once, in `CommandDispatcher`.

servers:
  - url: http://127.0.0.1:7777
    description: A control plane on the same box. The default, and the only binding that needs no TLS.

security:
  - bearerAuth: []

tags:
  - name: instances
  - name: control-modes
    description: |
      An instance is `local` or `orchestrated`, never both and never a merged permission set. The
      runner arbitrates by the origin of the request and rejects the other plane outright, which is
      what stops two planes racing on one instance.
  - name: builds
  - name: content
  - name: sources
    description: |
      Building the game from a git checkout instead of installing a published release. Reads are open
      to both planes; everything that mutates is refused unless it came from the host owner's own
      plane, because these routes compile a repository named in the request.

paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      description: The only unauthenticated endpoint. Everything else carries a bearer token,
        including the WebSocket upgrade.
      responses:
        "200": { description: The plane is up }

  /api/v1/runner/status:
    get:
      tags: [instances]
      summary: Runner identity, resources and every instance it owns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerStatus" }

  /api/v1/agent/status:
    get:
      tags: [instances]
      deprecated: true
      summary: Deprecated alias of /api/v1/runner/status
      description: |
        A runner was called a host agent before it was called a runner. The alias is still routed so a
        plane pinned to the old name keeps working; nothing new should use it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerStatus" }

  /api/v1/instances:
    get:
      tags: [instances]
      summary: List instances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InstanceStatus" }
    post:
      tags: [instances]
      summary: Create an instance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceSpec" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSpec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            The name is taken. `code` is `instance_exists`, and it is a distinct answer from the 400
            above on purpose: a panel has to tell "pick another name" apart from "that request was
            malformed", because the first is one field to fix with everything else still on screen.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/v1/instances/{name}:
    parameters:
      - $ref: "#/components/parameters/InstanceName"
    get:
      tags: [instances]
      summary: Read an instance's configuration
      description: Allowed while orchestrated. The host owner keeps every read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSpec" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [instances]
      summary: Update an instance's configuration
      description: |
        Control fields are runner state and are ignored here. Accepting `control_mode`,
        `controller_url`, `granted_scopes` or `controlled_since` from a spec edit would let a PATCH
        hand the box to an orchestrator, or take it back without the release path that raises the
        alert.

        Setting `content_set` makes the runner fetch what it is missing. A package that fails to
        arrive or fails validation leaves the instance on its previous set rather than half applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceSpec" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSpec" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Orchestrated" }
    delete:
      tags: [instances]
      summary: Delete a stopped instance and its data
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/instances/{name}/config:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    get:
      tags: [instances]
      summary: Read this instance's server.cfg
      description: |
        The file the game executes at startup. It belongs to the game and to the operator, not to the
        runner, which never reads it: everything the runner needs is in the instance spec, and the
        cvars it does care about are pinned on the command line at every start so a stale copy in this
        file cannot contradict them.

        Allowed while orchestrated. The host owner keeps every read, and this file is on their disk.

        The body is the whole file as one string. Nothing here parses it, because a structured shape
        would be the runner claiming to understand a config format that is the game's.
      responses:
        "200":
          description: OK. `text` is empty for an instance that has no server.cfg yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerConfig" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [instances]
      summary: Replace this instance's server.cfg
      description: |
        Whole file, not a diff: it is a text box in a panel, and merging two edits of a config nobody
        parses would guess wrong.

        Written temp-and-move rather than in place. The file decides what the server comes up as and
        there is no other copy of it, so a truncating write interrupted by a crash or a full disk
        would leave an operator with an empty config and a server that boots wrong from it.

        Takes effect at the next start; the runner does not reload a running server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerConfig" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Orchestrated" }

  /api/v1/instances/{name}/status:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    get:
      tags: [instances]
      summary: Supervisor state plus a live getinfo snapshot
      description: |
        `players` is null when the server has not answered a probe, which is a different thing from
        answering with zero. A process that is alive but silent is not a running server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceStatus" }

  /api/v1/instances/{name}/logs:
    parameters:
      - $ref: "#/components/parameters/InstanceName"
      - name: tail
        in: query
        description: |
          Lines from the end of the runner's in-memory ring. Clamped rather than refused at either
          end: above the ring there is nothing more to return, so asking for more than the runner
          keeps means all of it. A value that is not a number is the default, because a log read is
          not worth failing over a typo in a query string.
        schema: { type: integer, default: 500, minimum: 1, maximum: 2000 }
    get:
      tags: [instances]
      summary: Recent output
      description: |
        Includes parsed eventlog lines. Chat is flagged with `is_chat`, and a plane without the
        `chat-read` scope must drop those before forwarding: reading player chat on somebody's
        community server is a privacy-relevant grant that does not ride along with operating it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogLine" }

  /api/v1/instances/{name}/audit:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    get:
      tags: [control-modes]
      summary: What was done to this instance, and by whom
      description: |
        The runner records this independently of any control plane. That is what lets a host owner
        see what an orchestrator did to their box, rather than taking the orchestrator's word for it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: string } }

  /api/v1/instances/{name}/content:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    get:
      tags: [content]
      summary: The content set this instance is configured for
      description: |
        What the spec asks for, not what is on disk: a package the runner has not fetched yet is
        still listed here. `/api/v1/content` is the other half, and the difference between the two is
        what a sync is still owed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_set:
                    type: array
                    items: { type: string, pattern: "^[0-9a-f]{64}$" }
                  cache_dir: { type: string, nullable: true }

  /api/v1/instances/{name}/start:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [instances]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InstanceStatus" } } } }
        "409": { $ref: "#/components/responses/Orchestrated" }

  /api/v1/instances/{name}/restart:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [instances]
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Orchestrated" }

  /api/v1/instances/{name}/stop:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [control-modes]
      summary: Stop an instance
      description: |
        One of the host owner's two exits, and available to them whatever the control mode: it is
        their hardware. On an orchestrated instance the runner emits a control event first and waits
        briefly for an ack, then proceeds regardless.
      responses:
        "200": { description: OK }

  /api/v1/instances/{name}/drain:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [instances]
      summary: Warn players, wait for the server to empty, then stop
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                timeout_seconds: { type: integer, default: 300 }
      responses:
        "200": { description: OK }
        "409": { $ref: "#/components/responses/Orchestrated" }

  /api/v1/instances/{name}/exec:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [instances]
      summary: Run a console command
      description: |
        Delivered over the child's stdin when the runner owns it, and over loopback srcon otherwise
        (an adopted orphan whose stdin died with the previous runner). A command containing a control
        character or a semicolon is refused: the game refuses it too, even with a valid password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string }
      responses:
        "200": { description: Sent }
        "409": { $ref: "#/components/responses/Orchestrated" }

  /api/v1/instances/{name}/release:
    parameters: [{ $ref: "#/components/parameters/InstanceName" }]
    post:
      tags: [control-modes]
      summary: Return an orchestrated instance to local control
      description: |
        The other of the host owner's two exits, and the one route deliberately not gated on control
        mode.

        `end_of_match` is the default because most releases are an operator wanting their box back
        rather than an emergency, and a one-click graceful option is what keeps the critical-alert
        queue worth reading. `now` is always available and gated on nothing, including on the
        orchestrator being reachable.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                when: { type: string, enum: [end_of_match, now], default: end_of_match }
                reason:
                  type: string
                  description: Attached to the alert. Worth reading before treating a mid-match
                    release as a problem.
      responses:
        "200":
          description: Released, or scheduled for the end of the current match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSpec" }

  /api/v1/builds:
    get:
      tags: [builds]
      summary: Installed builds
      description: A build is the unit both providers produce, so a downloaded release and a locally
        compiled one pin, update and roll back identically.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BuildSummary" } }

  /api/v1/content:
    get:
      tags: [content]
      summary: The content packages this runner has cached
      description: |
        The cache is shared by every instance on the box, so two servers running the same map pool
        hold one copy between them. Listing it never opens an archive: the file name is the hash,
        which is the point of addressing packages by their content. A package's name, its maps and
        where it was fetched from are not recoverable from the cache and are absent here rather than
        guessed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ContentPackage" } }

  /api/v1/sources:
    get:
      tags: [sources]
      summary: Configured sources
      description: |
        A source is a named repo and ref this box can build. `target` is resolved rather than left
        null, because null means "this platform's default" and the plane reading it may not be on
        this platform.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Source" } }
    post:
      tags: [sources]
      summary: Create or update a source
      description: |
        Updates in place: a body naming only `name` and `ref` changes only the ref and keeps the repo
        the source was pointed at. A verb that reset the fields it was not given would make changing
        a ref a two-field operation nobody would remember to complete.

        Local origin only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceRequest" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } }
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Source" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/OwnerOnly" }

  /api/v1/sources/{name}:
    parameters: [{ $ref: "#/components/parameters/SourceName" }]
    get:
      tags: [sources]
      summary: Can this box build this source, and against which engine
      description: |
        Collects every problem rather than stopping at the first, because the answer wanted is the
        whole list of things to install and not one of them per round trip.

        `vx` carries the checkout's own `./vx doctor --json`, when the ref has vx and it answered
        inside the budget this route allows it. It is reported beside `problems` and never merged
        into them: it answers a broader question than "can this build start", so one of its findings
        must not decide `ready`. Null means the ref predates vx, or doctor did not answer.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SourceStatus" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sources]
      summary: Forget a source
      description: |
        Deliberately leaves the checkout on disk. The spec is four fields; the checkout is gigabytes,
        and re-cloning it because a name was removed by mistake is an expensive way to learn that.

        Local origin only.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/{name}/build:
    parameters: [{ $ref: "#/components/parameters/SourceName" }]
    get:
      tags: [sources]
      summary: The current or most recent build job
      description: |
        The last job is kept after it ends rather than cleared: the poll that discovers a build
        finished is a different call from the one that started it, so dropping the record on
        completion would make success and "never heard of it" the same answer. 404 until one has run
        since the runner started.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SourceBuildJob" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [sources]
      summary: Start a build
      description: |
        Answers **202 with a job that has started**, not a build that has finished. Every other verb
        in this API answers inside the 30-second command envelope; a source build clones, compiles,
        exports and packages, and runs for tens of minutes. Poll the GET above.

        One at a time per box: two builds contend for the same cores, the same disk and — if they
        name the same source — the same checkout directory, where the second one's `git checkout
        --force` would pull the tree out from under the first. A second call gets 409.

        Local origin only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceBuildRequest" }
      responses:
        "202":
          description: Started
          content: { application/json: { schema: { $ref: "#/components/schemas/SourceBuildJob" } } }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A build is already running on this box
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/v1/sources/{name}/build/cancel:
    parameters: [{ $ref: "#/components/parameters/SourceName" }]
    post:
      tags: [sources]
      summary: Stop the running build
      description: |
        Kills the toolchain process tree. A cancelled build leaves its checkout and any content it
        already fetched, so the next attempt resumes from there rather than re-cloning.

        Local origin only.
      responses:
        "200":
          description: Cancelling
          content: { application/json: { schema: { $ref: "#/components/schemas/SourceBuildJob" } } }
        "403": { $ref: "#/components/responses/OwnerOnly" }
        "404": { description: Nothing was running }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Generated at `vortex runner install-service`, shown once, stored hashed.

  parameters:
    InstanceName:
      name: name
      in: path
      required: true
      description: |
        A name becomes a directory name and a command-line argument, so it is restricted rather than
        sanitized: silently rewriting an operator's name would make `vortex server start x` fail to
        find the thing they just created. '.' and '..' are excluded for the obvious reason.
      schema: { type: string, pattern: '^(?!\.\.?$)[A-Za-z0-9._-]{1,64}$' }

    SourceName:
      name: name
      in: path
      required: true
      description: |
        Same rule as an instance name and for the same reason: it becomes the directory the checkout
        lives in. Checkouts are keyed on this rather than on the repo's basename, so two sources
        pointing at different forks do not share one working tree and thrash it on every build.
      schema: { type: string, pattern: '^(?!\.\.?$)[A-Za-z0-9._-]{1,64}$' }

  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    NotFound:
      description: No such instance
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Conflict:
      description: Refused in the current state
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    OwnerOnly:
      description: |
        Refused because the call did not come from the host owner's own plane. Only the source routes
        answer this, and only the ones that mutate: they compile a repository named in the request,
        which exposed to an orchestrator would be arbitrary code execution addressed by URL — a
        different thing from the instance routes, which only ever start a binary already in the build
        store. An orchestrator keeps every read, including watching a running build.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example:
            code: scope_denied
            message: "source builds are the host owner's alone"

    Orchestrated:
      description: |
        The instance is under orchestrator control, so this mutating call is refused. The body names
        the controlling plane and both exits, which is what lets a UI render the banner and its two
        buttons without special-casing every endpoint that can produce this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example:
            code: instance_orchestrated
            message: "instance 'eu-1' is controlled by https://conductor.vortexfps.org"
            orchestrated:
              controller_url: https://conductor.vortexfps.org
              controlled_since: "2026-07-30T18:00:00Z"
              granted_scopes: [view, control-instances, moderate]
              release_path: release
              stop_path: stop

  schemas:
    InstanceSpec:
      type: object
      required: [name, map, port]
      properties:
        name: { type: string }
        map: { type: string }
        gametype: { type: string, default: dm }
        port:
          type: integer
          description: Always explicit. The runner reads the real bind line out of stdout before
            reporting the instance running, because a process that started is not a server that bound.
        max_players: { type: integer, default: 16 }
        hostname: { type: string }
        listed:
          type: boolean
          default: true
          description: Announce this instance to the master so it appears in the server browser. The
            runner pins sv_public accordingly at every start, so false means the server sends no
            announce at all rather than asking the master not to list it.
        build_id: { type: string, nullable: true }
        restart_policy: { type: string, enum: [always, on_failure, never], default: on_failure }
        restart_at:
          type: string
          nullable: true
          description: Unattended restart window as HH:mm in the box's local time. Local rather than
            UTC because an operator picking 05:00 means their quiet hour.
        restart_only_when_empty: { type: boolean, default: true }
        extra_args: { type: array, items: { type: string } }
        environment: { type: object, additionalProperties: { type: string } }
        content_set:
          type: array
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: sha256 of each package. The runner fetches what it is missing and verifies
            before installing; nothing is ever pushed at it.
        control_mode: { type: string, enum: [local, orchestrated], readOnly: true }
        controller_url: { type: string, nullable: true, readOnly: true }
        granted_scopes: { type: array, items: { type: string }, readOnly: true }
        controlled_since: { type: string, format: date-time, nullable: true, readOnly: true }

    InstanceStatus:
      type: object
      properties:
        name: { type: string }
        state: { type: string, enum: [stopped, starting, running, draining, stopping, flapping, failed] }
        control_mode: { type: string, enum: [local, orchestrated] }
        build_id: { type: string, nullable: true }
        pid: { type: integer, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        map: { type: string, nullable: true }
        gametype: { type: string, nullable: true }
        players:
          type: integer
          nullable: true
          description: Humans only, excluding bots. Null means the server has not answered a probe.
        bots: { type: integer, nullable: true }
        max_players: { type: integer, nullable: true }
        match_live: { type: boolean }
        match_elapsed_seconds: { type: integer, nullable: true }
        cpu_percent:
          type: number
          nullable: true
          description: Share of the whole machine, divided by core count, so two boxes are comparable.
        memory_bytes: { type: integer, nullable: true }
        restart_count: { type: integer }
        last_exit_reason: { type: string, nullable: true }

    RunnerStatus:
      type: object
      properties:
        runner_id: { type: string }
        version: { type: string }
        platform: { type: string }
        hostname: { type: string }
        started_at: { type: string, format: date-time }
        disk_free_bytes: { type: integer, nullable: true }
        cpu_percent: { type: number, nullable: true }
        memory_total_bytes: { type: integer, nullable: true }
        memory_used_bytes: { type: integer, nullable: true }
        conductor_url:
          type: string
          nullable: true
          description: Set when this runner is linked, whatever any single instance's mode is. A
            linked runner with every instance local is a normal state.
        instances: { type: array, items: { $ref: "#/components/schemas/InstanceStatus" } }

    ServerConfig:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The whole server.cfg. Empty means the instance has none yet, which is what a
            newly created instance looks like until it is first started.

    LogLine:
      type: object
      properties:
        instance_name: { type: string }
        stream: { type: string, enum: [stdout, stderr, event, runner] }
        text: { type: string }
        timestamp: { type: string, format: date-time }
        event_type: { type: string, nullable: true }
        is_chat:
          type: boolean
          description: True for chat, chat_team, chat_spec and chat_minigame. A plane without
            chat-read filters on this.

    BuildSummary:
      type: object
      properties:
        id: { type: string, description: "A version, or source:{ref}@{sha7}" }
        version: { type: string }
        provider: { type: string, enum: [release, source] }
        platform_key: { type: string }
        # "fat" is the old name for "complete" and is still listed because a build store written
        # before the rename can hand one back. The launcher normalizes it on read; a client reading
        # this API should treat the two as the same value.
        layout: { type: string, enum: [complete, core, fat], nullable: true }
        size_bytes: { type: integer }
        installed_at: { type: string, format: date-time }
        in_use: { type: boolean }

    ContentPackage:
      type: object
      required: [sha256, name]
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Of the whole .pk3. Nothing inside the archive is trusted to name it.
        name: { type: string }
        size_bytes: { type: integer }
        maps: { type: array, items: { type: string }, nullable: true }
        map_format:
          type: string
          nullable: true
          description: bsp or vmap. Both are accepted; the legacy format keeps working while vmap
            becomes the norm.
        added_at: { type: string, format: date-time, nullable: true }
        url:
          type: string
          nullable: true
          description: Where a runner, or a joining player, fetches it. Content-addressed, so it is
            cacheable and safe to hand to a CDN.

    Source:
      type: object
      required: [name, repo, ref, target]
      properties:
        name: { type: string }
        repo: { type: string, description: "git URL; defaults to the game repo, forks are the point" }
        ref: { type: string, description: "branch, tag or sha" }
        target:
          type: string
          description: |
            Export preset. Always resolved: a stored source may not name one, and the default is the
            platform's, which the plane reading this may not share.
          enum: [windows-client, linux-client, linux-dedicated, macos-client]
        godot:
          type: string
          nullable: true
          description: |
            Where this box's Godot editor is, when it is not discoverable. Per source rather than
            global because two sources can pin two engine versions.
        last_build_id: { type: string, nullable: true }
        last_built_sha: { type: string, nullable: true }
        last_built_at: { type: string, format: date-time, nullable: true }

    SourceRequest:
      type: object
      required: [name]
      description: |
        Every field but the name is optional, because this updates in place. Absent is "leave it
        alone", not "clear it".
      properties:
        name: { type: string, pattern: '^(?!\.\.?$)[A-Za-z0-9._-]{1,64}$' }
        repo: { type: string }
        ref: { type: string }
        target: { type: string, enum: [windows-client, linux-client, linux-dedicated, macos-client] }
        godot: { type: string }

    SourceStatus:
      type: object
      properties:
        name: { type: string }
        repo: { type: string }
        ref: { type: string }
        checkout: { type: string, description: Where the working tree is, whether or not it exists yet }
        checked_out: { type: boolean }
        sha: { type: string, nullable: true, description: "HEAD, or null if git cannot name one" }
        preset: { type: string }
        platform_key: { type: string, nullable: true }
        engine_version:
          type: string
          nullable: true
          description: |
            Read from the checkout's own tools/engine-patches/engine.lock.json, which is the file CI
            and verify-engine-template.py already check against. Prose in docs drifts; a lockfile is
            what gets trusted.
        engine_tag: { type: string, nullable: true }
        template_present:
          type: boolean
          description: |
            Cached and the right size. Present is not verified — the build re-checks the sha256
            through the tool that owns that answer.
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              ok: { type: boolean }
              path: { type: string, nullable: true }
              problem: { type: string, nullable: true }
        ready:
          type: boolean
          description: The launcher's verdict, and only the launcher's. `vx` below never changes it.
        problems: { type: array, items: { type: string } }
        vx:
          type: object
          nullable: true
          description: |
            The checkout's own `./vx doctor --json`. Null when the ref predates vx or doctor did not
            answer in the budget this route allows it. Worth reading for one check nothing on the
            launcher's side can make: whether the editor's stock export templates are installed,
            which macos-client exports need and no other preset does.
          properties:
            ok: { type: boolean, description: vx's verdict on its own required items }
            unsupported_schema:
              type: integer
              nullable: true
              description: |
                Set, with the number vx sent, when it is not one the launcher reads; `checks` is
                empty in that case. Reporting a schema nobody understood as "nothing wrong" is the
                failure the version field exists to prevent.
            checks:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  status: { type: string, enum: [ok, warn, missing] }
                  detail: { type: string }
                  required: { type: boolean }
                  fix: { type: string, nullable: true }
        last_build_id: { type: string, nullable: true }
        last_built_at: { type: string, format: date-time, nullable: true }

    SourceBuildRequest:
      type: object
      properties:
        target:
          type: string
          description: Overrides the source's preset for one run without rewriting the spec.
          enum: [windows-client, linux-client, linux-dedicated, macos-client]
        fetch_maps:
          type: boolean
          default: true
          description: |
            Defaults true. A build with no maps starts and then finds nothing to load, which reads as
            a broken game rather than a partial build, so it is not what saying nothing should get.

    SourceBuildJob:
      type: object
      required: [source_name, ref, state, started_at]
      properties:
        source_name: { type: string }
        ref: { type: string }
        state: { type: string, enum: [running, succeeded, failed, cancelled] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        build_id:
          type: string
          nullable: true
          description: |
            The build store id once there is one. This is the handle `builds pin` and
            `server create --build` take, and it is what a plane is waiting for.
        sha: { type: string, nullable: true }
        preset: { type: string, nullable: true }
        code:
          type: string
          nullable: true
          description: |
            Why it failed, as a code rather than prose, so a caller can tell "install Godot" from
            "this ref does not build".
          enum:
            - git_missing
            - dotnet_missing
            - python_missing
            - bash_missing
            - editor_missing
            - editor_unusable
            - engine_skew
            - checkout_incomplete
            - lockfile_unreadable
            - preset_unknown
            - cross_platform
            - git_failed
            - template_fetch_failed
            - export_failed
            - package_failed
            - verification_failed
            - step_failed
        error: { type: string, nullable: true }
        log:
          type: array
          items: { type: string }
          description: |
            The tail of the toolchain output, bounded to the last 500 lines. A twenty-minute export
            writes more than a process meant to stay up for weeks should keep.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - instance_orchestrated
            - instance_not_found
            - instance_exists
            - instance_running
            - build_not_found
            - content_not_found
            - content_invalid
            - port_unavailable
            - scope_denied
            - unauthorized
            - invalid_request
        message: { type: string }
        orchestrated:
          type: object
          nullable: true
          properties:
            controller_url: { type: string }
            controlled_since: { type: string, format: date-time, nullable: true }
            granted_scopes: { type: array, items: { type: string } }
            release_path: { type: string, default: release }
            stop_path: { type: string, default: stop }
